<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <title>Logg inn</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #6e45e2, #88d3ce);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: 600;
            color: #555;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #6e45e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #5a36c9;
        }
        .footer-links {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .footer-links a {
            color: #6e45e2;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .error {
            color: #e74c3c;
            margin-top: 1rem;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Logg inn</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label for="username">Brukernavn</label>
            <input type="text" id="username" name="username" value="{{ request.form.username or '' }}" required>

            <label for="password">Passord</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Logg inn</button>
        </form>

        <div class="footer-links">
            <a href="/signup">Registrer ny bruker</a> • 
            <a href="/forgot-password">Glemt passord</a> • 
            <a href="/">Forsiden</a>
        </div>
    </div>
</body>
</html>
