{% extends "base.html" %}
{% block title %}Logg inn{% endblock %}
{% block content %}
<div class="page-wrap">
  <div class="login-card login-card--narrow">
    <h2>Logg inn</h2>
    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="input-field">
        <label for="username">Brukernavn</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="input-field">
        <label for="password">Passord</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button type="submit" class="btn">Logg inn</button>
    </form>
    <div class="form-links" style="margin-top:14px;">
        <a href="/signup">Registrer ny bruker</a>
      <a href="/forgot-password">Glemt passord</a>
      <a href="/">Forsiden</a>
    </div>
  </div>
</div>
{% endblock %}
