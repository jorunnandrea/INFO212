{% extends "base.html" %}
{% block title %}Glemt passord{% endblock %}
{% block content %}
<div class="page-wrap">
  <div class="login-card login-card--narrow">
    <h2>Glemt passord</h2>
    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}
    <form action="/forgot-password" method="post">
      <div class="input-field">
        <label for="username">Brukernavn</label>
        <input id="username" name="username" required>
      </div>
      <button type="submit" class="btn">Tilbakestill</button>
    </form>
    <div class="form-links" style="margin-top:14px;">
      <a href="/login">Til innlogging</a>
      <a href="/">Forsiden</a>
    </div>
  </div>
</div>
{% endblock %}
