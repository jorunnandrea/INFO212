<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Ka skjer i Bergen?</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <h1><a href="/">Ka skjer i Bergen?</a></h1>
            {% if current_user %}
            <div class="nav-user">
                <span>Velkommen, {{ current_user.username }}!</span>
                <form action="/logout" method="post" style="display: inline;">
                    <button type="submit">Logg ut</button>
                </form>
            </div>
            {% else %}
            <div class="nav-login">
                <a href="/login">Logg inn</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        <h2>Endre Passord</h2>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="post" action="/change-password">
            <div class="form-group">
                <label for="current_password">Nåværende passord:</label>
                <input type="password" id="current_password" name="current_password" required placeholder="Skriv inn nåværende passord">
            </div>

            <div class="form-group">
                <label for="new_password">Nytt passord:</label>
                <input type="password" id="new_password" name="new_password" required placeholder="Skriv inn nytt passord">
            </div>

            <div class="form-group">
                <label for="confirm_new_password">Bekreft nytt passord:</label>
                <input type="password" id="confirm_new_password" name="confirm_new_password" required placeholder="Bekreft nytt passord">
            </div>

            <button type="submit" class="login-btn">Endre passord</button>
        </form>

        <div class="form-links">
            <a href="/">Tilbake til hjemmeside</a>
        </div>
    </div>
</body>
</html>
