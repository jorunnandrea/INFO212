{% extends "base.html" %}
{% block title %}Endre passord{% endblock %}
{% block content %}
<div class="page-wrap">
  <div class="login-card login-card--narrow">
    <h2>Endre passord</h2>
    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}
    <form method="post" action="/change-password">
      <div class="input-field">
        <label for="current_password">Nåværende passord</label>
        <input id="current_password" name="current_password" type="password" required>
      </div>
      <div class="input-field">
        <label for="new_password">Nytt passord</label>
        <input id="new_password" name="new_password" type="password" required>
      </div>
      <div class="input-field">
        <label for="confirm_new_password">Bekreft nytt passord</label>
        <input id="confirm_new_password" name="confirm_new_password" type="password" required>
      </div>
      <button type="submit" class="btn">Lagre</button>
    </form>
    <div class="form-links" style="margin-top:14px;">
      <a href="/dashboard">Til dashboard</a>
      <a href="/">Forsiden</a>
    </div>
  </div>
</div>
{% endblock %}
